name: Build Linux Wheels

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      - release/*
    tags:
        # NOTE: Binary build pipelines should only get triggered on release candidate builds
        # Release candidate tags look like: v1.11.0-rc1
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      runner-fleet: osdc
      with-xpu: enable
      build-python-only: enable
  # Fails if the matrix builds an accelerator variant (cpu, cu134, ...) more than once.
  # The py3-none wheel covers every Python, so each variant needs a single build.
  check-one-build-per-variant:
    needs: generate-matrix
    runs-on: ubuntu-latest
    steps:
      - env:
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
        run: |
          dupes=$(jq -r '.include | group_by(.desired_cuda) | map(select(length > 1)
            | "\(.[0].desired_cuda): \(map(.python_version) | join(", "))") | .[]' <<< "$MATRIX")
          [[ -z "$dupes" ]] || { echo "More than one build per variant:"; echo "$dupes"; exit 1; }
  build:
    needs: [generate-matrix, check-one-build-per-variant]
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: pytorch/vision
            pre-script: packaging/pre_build_script.sh
            post-script: packaging/post_build_script.sh
            smoke-test-script: test/smoke_test.py
            package-name: torchvision
    name: ${{ matrix.repository }}
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: ${{ matrix.repository }}
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      pre-script: ${{ matrix.pre-script }}
      post-script: ${{ matrix.post-script }}
      package-name: ${{ matrix.package-name }}
      smoke-test-script: ${{ matrix.smoke-test-script }}
      trigger-event: ${{ github.event_name }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # The build job only installs the wheel into the interpreter that built it, the
  # oldest supported one. Check other versions, including a free-threaded one.
  test-py3-none-wheel:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15", "3.15t"]
    name: test-py3-none-wheel-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-py3-none-wheel
        with:
          python-version: ${{ matrix.python-version }}
          artifact-pattern: "*_cpu_x86_64"
          wheel-glob: "dist/torchvision-*-py3-none-manylinux*_x86_64.whl"
